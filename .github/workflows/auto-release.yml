name: Auto Release on Version Change

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, publish to npm and create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine version and what is left to do
        id: meta
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # npm and the GitHub release are checked independently, so a re-run completes a partial release
          if [ -n "$(npm view "nestjs-multi-storage@$VERSION" version 2>/dev/null)" ]; then
            echo "Version $VERSION is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.meta.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to the 11.x line (trusted publishing needs >= 11.5.1)
        if: steps.meta.outputs.publish == 'true'
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.meta.outputs.publish == 'true'
        run: npm ci

      - name: Lint
        if: steps.meta.outputs.publish == 'true'
        # Without --fix, so formatting problems fail the build instead of being fixed silently
        run: npx eslint 'lib/**/*.ts'

      - name: Check formatting
        if: steps.meta.outputs.publish == 'true'
        run: npx prettier --check 'lib/**/*.ts' 'tests/**/*.ts'

      - name: Build
        if: steps.meta.outputs.publish == 'true'
        run: npm run build

      - name: Test (e2e, starts adobe/s3mock via Docker)
        if: steps.meta.outputs.publish == 'true'
        env:
          REQUIRE_S3_TESTS: '1' # fail instead of skipping the S3 suites when s3mock cannot start
        run: npm run test:e2e

      - name: Publish to npm
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        if: steps.meta.outputs.release == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG section for $VERSION, falling back to generated notes."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.meta.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ steps.meta.outputs.version }}
          body_path: ${{ steps.notes.outputs.found == 'true' && steps.notes.outputs.path || '' }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
