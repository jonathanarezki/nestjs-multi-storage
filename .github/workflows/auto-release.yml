name: Auto Release on Version Change

on:
  push:
    branches:
      - main
    paths:
      - 'packages/*/package.json'
  workflow_dispatch: # re-run a release for the current versions, e.g. after fixing a failed run

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    name: Determine versions and what is left to do
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any_publish: ${{ steps.meta.outputs.any_publish }}
      core_name: ${{ steps.meta.outputs.core_name }}
      core_version: ${{ steps.meta.outputs.core_version }}
      core_prerelease: ${{ steps.meta.outputs.core_prerelease }}
      core_publish: ${{ steps.meta.outputs.core_publish }}
      core_release: ${{ steps.meta.outputs.core_release }}
      nestjs_name: ${{ steps.meta.outputs.nestjs_name }}
      nestjs_version: ${{ steps.meta.outputs.nestjs_version }}
      nestjs_prerelease: ${{ steps.meta.outputs.nestjs_prerelease }}
      nestjs_publish: ${{ steps.meta.outputs.nestjs_publish }}
      nestjs_release: ${{ steps.meta.outputs.nestjs_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine versions and what is left to do
        id: meta
        run: |
          any_publish=false

          # $1 = output prefix, $2 = package directory
          check() {
            local key="$1" dir="$2"
            local name version tag
            name=$(jq -r .name "packages/$dir/package.json")
            version=$(jq -r .version "packages/$dir/package.json")
            tag="$name@$version"
            echo "Detected $tag"
            echo "${key}_name=$name" >> "$GITHUB_OUTPUT"
            echo "${key}_version=$version" >> "$GITHUB_OUTPUT"

            if [[ "$version" == *-* ]]; then
              echo "${key}_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "${key}_prerelease=false" >> "$GITHUB_OUTPUT"
            fi

            # npm and the GitHub release are checked independently, so a re-run completes a partial release.
            # A package that does not exist on npm yet prints nothing, which also counts as "not published".
            if [ -n "$(npm view "$tag" version 2>/dev/null)" ]; then
              echo "$tag is already on npm."
              echo "${key}_publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "${key}_publish=true" >> "$GITHUB_OUTPUT"
              any_publish=true
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists."
              echo "${key}_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "${key}_release=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check core core
          check nestjs nestjs
          echo "any_publish=$any_publish" >> "$GITHUB_OUTPUT"

  test:
    name: Test on Node ${{ matrix.node }}
    needs: meta
    if: needs.meta.outputs.any_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Without --fix, so formatting problems fail the build instead of being fixed silently
        run: npx eslint 'packages/*/src/**/*.ts'

      - name: Check formatting
        run: npx prettier --check 'packages/*/src/**/*.ts' 'tests/**/*.ts' 'scripts/**/*.ts'

      - name: Build
        # Before the tests: one of them spawns a child process that needs dist
        run: npm run build

      - name: Check the public API against the 0.8.0 baseline
        run: npm run check:api

      - name: Test (e2e, starts adobe/s3mock via Docker)
        env:
          REQUIRE_S3_TESTS: '1' # fail instead of skipping the S3 suites when s3mock cannot start
        run: npm run test:e2e

  release:
    name: Publish to npm and create GitHub releases
    needs: [meta, test]
    # test is skipped when nothing needs publishing; a failed or cancelled test blocks the release
    if: always() && needs.meta.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: needs.meta.outputs.any_publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to the 11.x line (trusted publishing needs >= 11.5.1)
        if: needs.meta.outputs.any_publish == 'true'
        run: npm install -g npm@11

      - name: Install dependencies
        if: needs.meta.outputs.any_publish == 'true'
        run: npm ci

      - name: Build
        if: needs.meta.outputs.any_publish == 'true'
        run: npm run build

      # The core goes first: nestjs-multi-storage depends on it
      - name: Publish ${{ needs.meta.outputs.core_name }} to npm
        if: needs.meta.outputs.core_publish == 'true'
        env:
          PACKAGE: ${{ needs.meta.outputs.core_name }}
          PRERELEASE: ${{ needs.meta.outputs.core_prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish -w "$PACKAGE" --access public --tag next
          else
            npm publish -w "$PACKAGE" --access public
          fi

      - name: Publish ${{ needs.meta.outputs.nestjs_name }} to npm
        if: needs.meta.outputs.nestjs_publish == 'true'
        env:
          PACKAGE: ${{ needs.meta.outputs.nestjs_name }}
          PRERELEASE: ${{ needs.meta.outputs.nestjs_prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish -w "$PACKAGE" --access public --tag next
          else
            npm publish -w "$PACKAGE" --access public
          fi

      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_NAME: ${{ needs.meta.outputs.core_name }}
          CORE_VERSION: ${{ needs.meta.outputs.core_version }}
          CORE_PRERELEASE: ${{ needs.meta.outputs.core_prerelease }}
          CORE_RELEASE: ${{ needs.meta.outputs.core_release }}
          NESTJS_NAME: ${{ needs.meta.outputs.nestjs_name }}
          NESTJS_VERSION: ${{ needs.meta.outputs.nestjs_version }}
          NESTJS_PRERELEASE: ${{ needs.meta.outputs.nestjs_prerelease }}
          NESTJS_RELEASE: ${{ needs.meta.outputs.nestjs_release }}
        run: |
          # $1 = package directory, $2 = name, $3 = version, $4 = prerelease (true/false), $5 = release needed (true/false)
          release() {
            local dir="$1" name="$2" version="$3" prerelease="$4" needed="$5"
            local tag="$name@$version" notes="$RUNNER_TEMP/notes-$1.md"
            if [ "$needed" != "true" ]; then
              echo "Release $tag already exists, skipping."
              return
            fi

            awk -v header="## [$version]" '
              index($0, header) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' "packages/$dir/CHANGELOG.md" > "$notes"

            args=(--target "$GITHUB_SHA" --title "$name $version")
            if [ "$prerelease" = "true" ]; then args+=(--prerelease); fi
            if grep -q '[^[:space:]]' "$notes"; then
              args+=(--notes-file "$notes")
            else
              echo "No CHANGELOG section for $tag, falling back to generated notes."
              args+=(--generate-notes)
            fi
            gh release create "$tag" "${args[@]}"
          }

          release core "$CORE_NAME" "$CORE_VERSION" "$CORE_PRERELEASE" "$CORE_RELEASE"
          release nestjs "$NESTJS_NAME" "$NESTJS_VERSION" "$NESTJS_PRERELEASE" "$NESTJS_RELEASE"
